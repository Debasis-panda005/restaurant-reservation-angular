<div class="dashboard-container">
  <header class="dashboard-header">
    <h1 class="dashboard-title">Staff Dashboard</h1>
  </header>

  <section class="cards-grid">
    <div class="card">
      <div class="card-label">Total Reservations</div>
      <div class="card-value">{{ totalReservations }}</div>
    </div>

    <div class="card">
      <div class="card-label">Pending Reservations</div>
      <div class="card-value">{{ pendingReservations }}</div>
    </div>

    <div class="card">
      <div class="card-label">Current Queue</div>
      <div class="card-value">{{ currentQueue }}</div>
    </div>

    <div class="card">
      <div class="card-label">Available Tables</div>
      <div class="card-value">{{ availableTables }}</div>
    </div>
  </section>
</div>
