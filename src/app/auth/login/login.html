<div class="login-container">

  <!-- Cinematic Restaurant Photographic Background Layer (Fixed & Blurred, Culinary Masterpiece) -->
  <div class="cinematic-backdrop" aria-hidden="true">
    <div
      class="cinematic-backdrop-img"
      style="background-image: url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=2000&q=80');"
    ></div>
    <div class="cinematic-backdrop-overlay"></div>
  </div>

  <div class="login-card">

    <!-- Luxury Crest Mark -->
    <div class="brand-crest">
      <svg class="crest-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" stroke="#C9A45C" stroke-width="1.5" stroke-dasharray="2 3"/>
        <circle cx="24" cy="24" r="18" stroke="#C9A45C" stroke-width="1"/>
        <path d="M19 14V22C19 23.6569 20.3431 25 22 25V34M22 14V22M25 14V22C25 23.6569 23.6569 25 22 25" stroke="#C9A45C" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M29 14C29 18 28 22 28 25V34M28 14H30C30 19 28 25 28 25" stroke="#C9A45C" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="login-header">
      <span class="eyebrow-tag">CONCIERGE &amp; RESERVATIONS</span>
      <h1>Restaurant Reservation</h1>
      <p class="subtitle">Please sign in to access your private dining reservations.</p>
    </div>

    <div class="auth-error-banner" *ngIf="errorMessage">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="login()" class="login-form">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="patron@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span>{{ isLoading ? 'Authenticating...' : 'Sign In to Concierge' }}</span>
        <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

    </form>

    <!-- Register Link -->
    <div class="login-footer">
      <span class="divider-line"></span>
      <p>
        New patron?
        <a routerLink="/register">Create an account</a>
      </p>
    </div>

  </div>
</div>
